# helpdrift Autopilot.
# Stages: test -> docs-drift -> secure -> package -> release -> pages.
# The scheduled scan job is the monitor stretch. See docs/AUTOPILOT.md.
# No tokens are stored in this file. Jobs use the predefined CI_JOB_TOKEN.

stages:
  - test
  - docs-drift
  - secure
  - package
  - release
  - pages

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      variables:
        SAST_DISABLED: "true"
        SECRET_DETECTION_DISABLED: "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  # Scanner templates run in merge request pipelines only when this is set.
  # https://docs.gitlab.com/user/application_security/detect/security_configuration/
  AST_ENABLE_MR_PIPELINES: "true"
  CGO_ENABLED: "0"
  GOPROXY: "https://proxy.golang.org,direct"

default:
  image: golang:1.22

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

# Templates default to stage "test". Move them after the drift gate.
# Analyzer jobs extend these parents.
# https://docs.gitlab.com/user/application_security/detect/security_configuration/
sast:
  stage: secure

.sast-analyzer:
  stage: secure

secret_detection:
  stage: secure

.secret-analyzer:
  stage: secure

test:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  script:
    - sh scripts/ensure-git.sh
    - go test ./...

docs-drift:
  stage: docs-drift
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: "0"
  script:
    - sh scripts/ensure-git.sh
    - go build -trimpath -ldflags "-s -w -X main.version=${CI_COMMIT_SHORT_SHA}" -o bin/helpdrift ./cmd/helpdrift
    - mkdir -p reports
    - |
      if [ -z "${CI_MERGE_REQUEST_DIFF_BASE_SHA}" ]; then
        echo "CI_MERGE_REQUEST_DIFF_BASE_SHA is empty."
        exit 2
      fi
      set +e
      ./bin/helpdrift check \
        --base "${CI_MERGE_REQUEST_DIFF_BASE_SHA}" \
        --head "${CI_COMMIT_SHA}" \
        --docs 'docs/**/*.md' \
        --format text \
        --json-file reports/helpdrift.json \
        --markdown-file reports/helpdrift.md \
        --fail-on-findings
      status=$?
      set -e
      if [ -f reports/helpdrift.md ]; then
        go run ./scripts/ci note reports/helpdrift.md
      fi
      exit "${status}"
  artifacts:
    when: always
    paths:
      - reports/helpdrift.json
      - reports/helpdrift.md

# Stretch: nightly helpdrift scan. Create the schedule in the GitLab UI.
docs-drift-scan:
  stage: docs-drift
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - go build -trimpath -o bin/helpdrift ./cmd/helpdrift
    - mkdir -p reports
    - |
      set +e
      ./bin/helpdrift scan \
        --docs 'docs/**/*.md' \
        --format text \
        --json-file reports/helpdrift-scan.json \
        --markdown-file reports/helpdrift-scan.md \
        --fail-on-findings
      status=$?
      set -e
      if [ "${status}" -eq 1 ]; then
        go run ./scripts/ci issue reports/helpdrift-scan.md
        exit 1
      fi
      exit "${status}"
  artifacts:
    when: always
    paths:
      - reports/helpdrift-scan.json
      - reports/helpdrift-scan.md

package:
  stage: package
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - sh scripts/package-binaries.sh
  artifacts:
    paths:
      - dist/

release-notes:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GIT_DEPTH: "0"
  script:
    - sh scripts/ensure-git.sh
    - sh scripts/release-notes.sh > release-notes.md
  artifacts:
    paths:
      - release-notes.md

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: package
      artifacts: false
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    GIT_DEPTH: "0"
  script:
    - sh scripts/ensure-git.sh
    - sh scripts/release-notes.sh > release-notes.md
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "helpdrift $CI_COMMIT_TAG"
    description: ./release-notes.md
    assets:
      links:
        - name: helpdrift-linux-amd64
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/helpdrift/${CI_COMMIT_TAG}/helpdrift-linux-amd64"
        - name: helpdrift-linux-arm64
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/helpdrift/${CI_COMMIT_TAG}/helpdrift-linux-arm64"
        - name: helpdrift-darwin-amd64
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/helpdrift/${CI_COMMIT_TAG}/helpdrift-darwin-amd64"
        - name: helpdrift-darwin-arm64
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/helpdrift/${CI_COMMIT_TAG}/helpdrift-darwin-arm64"
        - name: helpdrift-windows-amd64.exe
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/helpdrift/${CI_COMMIT_TAG}/helpdrift-windows-amd64.exe"

pages-preview:
  stage: pages
  image: python:3.12-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - python3 scripts/build_pages.py
  artifacts:
    paths:
      - public

pages:
  stage: pages
  image: python:3.12-alpine
  resource_group: pages
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - python3 scripts/build_pages.py
  pages: true
